# Isolated, self-contained stack for CodeBot pre-merge testing.
#
# Mirrors this repo's own CI (.github/workflows/test.yml): a throwaway
# Postgres (db/user/pass all "test", matching openstates/test_settings.py's
# hardcoded defaults exactly) plus a `core` service built from this repo's
# own Dockerfile, running against THIS checkout (CodeBot's clone) rather
# than a developer's bind-mounted working copy.
#
# No published host ports, so this never collides with the repo's own dev
# docker-compose.yml (which publishes 5432 for local development).
# Always launch via .codebot/test.sh (unique project name + per-run image tag).

services:
  core:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${CODEBOT_TEST_IMAGE:?CODEBOT_TEST_IMAGE must be set — run via .codebot/test.sh}
    # Code under test comes from THIS checkout (CodeBot's clone), overlaying
    # whatever was baked into the image at build time.
    volumes:
      - ..:/opt/os
    environment:
      PYTHONPATH: "."
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    # No `ports:` — internal only.

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    # No named volume — dropped on `down -v`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 3s
      timeout: 3s
      retries: 10
